name: Benchmark
on:
  pull_request:
  workflow_run:
    workflows: [Benchmark]
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: write
jobs:
  probe:
    if: github.event_name == 'pull_request' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Print the trigger
        run: echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF"
      - name: Comment
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          number="$(gh pr list --limit 1 --json number --jq '.[0].number')"
          gh pr comment "$number" --body "hello from workflow_run"
